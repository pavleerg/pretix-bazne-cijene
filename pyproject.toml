[project]
name = "pretix-bazne-cijene"
dynamic = ["version"]
description = "Shows the Croatian base price (bazna cijena, ZZP čl. 7 and Pravilnik NN 132/2026) next to every ticket in the pretix shop"
readme = "README.rst"
license = {text = "Proprietary"}
keywords = ["pretix"]
authors = [
    {name = "Pavle Ergović", email = "pavle.ergovic@kset.org"},
]
maintainers = [
    {name = "Pavle Ergović", email = "pavle.ergovic@kset.org"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_bazne_cijene = "pretix_bazne_cijene:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://karte.kset.org"
repository = "https://karte.kset.org"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_bazne_cijene.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
